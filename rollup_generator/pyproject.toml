[tool.poetry]
name = "rollup-generator"
version = "0.1.0"
description = "Define event sourcing events and how to roll them into entity snapshots."
authors = ["counterweight <counterweightoperator@protonmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.2.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
rollup-generator = "rollup_generator.cli:cli"